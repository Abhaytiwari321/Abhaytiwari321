<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Abhay Tiwari, Full Stack Developer profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#4de2d0"/>
      <animate attributeName="x1" values="0;0.25;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4de2d0" stop-opacity=".22"/><stop offset="1" stop-color="#4de2d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#29445d" stroke-width=".6" opacity=".42"/>
    </pattern>
    <clipPath id="frame"><rect x="18" y="18" width="1144" height="574" rx="24"/></clipPath>
  </defs>
